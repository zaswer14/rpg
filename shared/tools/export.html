<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Job Library export</title></head>
<body>
<!-- Công cụ: chạy kiểm tra thư viện + in Markdown của catalog. Mở trên trình duyệt, hoặc headless:
     msedge --headless --disable-gpu --dump-dom file:///<repo>/shared/tools/export.html  > out.html
     Kết quả: khối pre#check (lỗi/cảnh báo, rỗng = sạch) và khối pre#md (nội dung cho docs/02 mục Danh mục). -->
<script src="../schools.js"></script><script src="../trunk.js"></script><script src="../aspects.js"></script><script src="../faiths.js"></script>
<script src="../races/skeleton.js"></script><script src="../races/human.js"></script><script src="../races/elf.js"></script><script src="../races/dwarf.js"></script><script src="../races/beastfolk.js"></script>
<script src="../races/merfolk.js"></script><script src="../races/orc.js"></script><script src="../races/dragonkin.js"></script><script src="../races/fae.js"></script><script src="../races/construct.js"></script>
<script src="../archetypes/combat.js"></script><script src="../archetypes/ranged.js"></script><script src="../archetypes/shadow.js"></script><script src="../archetypes/arcane.js"></script>
<script src="../archetypes/death.js"></script><script src="../archetypes/craft.js"></script><script src="../archetypes/beast.js"></script><script src="../archetypes/martial.js"></script>
<script src="../compose.js"></script><script src="../catalog.js"></script>
<script src="../bestiary/rules.js"></script><script src="../bestiary/species.js"></script><script src="../bestiary/biomes.js"></script><script src="../bestiary/bestiary.js"></script>
<pre id="check"></pre><pre id="md"></pre>
<script>
  const L = window.JobLibrary, c = L.catalog(), lines = [];
  for (const e of c.errors) lines.push('ERROR ' + e);
  for (const w of c.warnings) lines.push('WARN ' + w);
  for (const r of Object.keys(L.races)) { const g = L.compose({ races: [r] }); for (const e of g.errors) lines.push('COMPOSE ' + r + ' ' + e); }
  const B = L.bestiary(); for (const e of B.errors) lines.push('BESTIARY ERROR ' + e); for (const w of B.warnings) lines.push('BESTIARY WARN ' + w);
  document.getElementById('check').textContent = lines.join('\n');
  document.getElementById('md').textContent = L.catalogMarkdown();
</script>
</body></html>
