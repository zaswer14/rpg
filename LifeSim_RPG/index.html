<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vạn Kiếp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Vạn Kiếp</h1>
    <span class="sub">Mô phỏng một đời ở đại lục Varen</span>
  </div>
  <div class="controls">
    <button id="btnPause" class="btn" title="Tạm dừng / tiếp tục (Space)">⏸</button>
    <div class="speeds" id="speeds"></div>
    <label class="toggle" title="Nhân vật tự chọn focus và tự quyết định theo tính cách"><input type="checkbox" id="autoLife"> Tự sống</label>
    <button id="btnNew" class="btn">Kiếp mới</button>
    <button id="btnWorld" class="btn" title="Tạo một đại lục mới: quốc gia, thành phố, làng mạc khác">Thế giới mới</button>
    <span class="seed" id="seedLabel"></span>
  </div>
</header>

<main class="layout">
  <!-- Nhân vật -->
  <section class="panel char" id="charPanel">
    <div class="who">
      <div class="nm" id="cName"></div>
      <div class="meta" id="cMeta"></div>
      <div class="meta" id="cPlace"></div>
    </div>
    <div class="kv" id="cKv"></div>
    <div class="xp"><div class="bar"><i id="xpBar"></i></div><span id="xpTxt"></span></div>
    <div class="stats" id="cStats"></div>
    <div class="chips" id="cConds"></div>
    <h3>Kỹ năng</h3>
    <div class="mast" id="cMast"></div>
    <h3>Gia đình</h3>
    <div class="fam" id="cFam"></div>
  </section>

  <!-- Bản đồ -->
  <section class="panel mapwrap">
    <div class="year">
      <span id="yLabel"></span>
      <div class="bar thin"><i id="yBar"></i></div>
    </div>
    <div class="canvasbox">
      <canvas id="map" width="1200" height="900" aria-label="Bản đồ đại lục Varen"></canvas>
      <div class="viewbtns" id="viewBtns" role="group" aria-label="Chế độ xem bản đồ"><button data-v="region">Vùng</button><button data-v="terrain">Địa hình</button><button data-v="political">Chính trị</button><button data-v="danger">Nguy hiểm</button></div>
      <div class="maplegend" id="mapLegend" hidden><span><i style="background:rgb(84,168,96)"></i>an toàn</span><span><i style="background:rgb(214,176,64)"></i>vừa sức</span><span><i style="background:rgb(210,96,62)"></i>nguy hiểm (Liều mạng)</span><span><i style="background:rgb(66,58,64)"></i>khóa</span></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="focus">
      <h3>Năm nay dồn sức vào</h3>
      <div class="focusbtns" id="focusBtns"></div>
    </div>
    <div class="huntbox">
      <div class="hhead">
        <h3>Khu săn ở <span id="huntRegion"></span></h3>
        <label class="toggle danger" title="Cho vào khu cao hơn sức mình một bậc; gặp quái tới Tier + 2"><input type="checkbox" id="reckless"> Liều mạng</label>
      </div>
      <div class="zones" id="zones"></div>
      <div class="zmons" id="zoneMons"></div>
    </div>
    <div class="region" id="regionPanel" hidden></div>
  </section>

  <!-- Nhật ký -->
  <section class="panel logwrap">
    <details class="peers" id="peersBox">
      <summary>Đồng niên <span id="peerCount"></span></summary>
      <div id="peers"></div>
    </details>
    <details class="lineage" id="lineageBox" hidden>
      <summary>Các kiếp trước</summary>
      <div id="lineage"></div>
    </details>
    <div class="log" id="log" aria-live="polite"></div>
  </section>
</main>

<!-- Quyết định -->
<div class="modal" id="decModal" hidden>
  <div class="card">
    <div class="dtitle" id="dTitle"></div>
    <div class="dbody" id="dBody"></div>
    <div class="dfact" id="dFact"></div>
    <div class="dchoices" id="dChoices"></div>
  </div>
</div>

<!-- Cái chết -->
<div class="modal" id="deathModal" hidden>
  <div class="card wide">
    <div class="epitaph" id="epi"></div>
    <canvas id="lifeChart" width="760" height="190"></canvas>
    <div class="legend" id="chartLegend"></div>
    <div class="dsum" id="dSum"></div>
    <div class="roll" id="roll">
      <div class="die" id="die">?</div>
      <div class="rolltxt" id="rollTxt"></div>
    </div>
    <div class="dchoices" id="deathBtns"></div>
  </div>
</div>

<!-- Thư viện dùng chung -->
<script src="../library/aspects.js"></script>
<script src="../library/schools.js"></script>
<script src="../library/trunk.js"></script>
<script src="../library/races/human.js"></script>
<script src="../library/races/elf.js"></script>
<script src="../library/races/dwarf.js"></script>
<script src="../library/races/orc.js"></script>
<script src="../library/races/beastfolk.js"></script>
<script src="../library/races/fae.js"></script>
<script src="../library/races/merfolk.js"></script>
<script src="../library/races/dragonkin.js"></script>
<script src="../library/races/construct.js"></script>
<script src="../library/races/skeleton.js"></script>
<script src="../library/faiths.js"></script>
<script src="../library/compose.js"></script>
<script src="../library/bestiary/rules.js"></script>
<script src="../library/bestiary/species.js"></script>
<script src="../library/bestiary/biomes.js"></script>
<script src="../library/bestiary/bestiary.js"></script>
<!-- Game -->
<script src="data/ecology.js"></script>
<script src="js/core.js"></script>
<script src="data/world.js"></script>
<script src="data/nations.js"></script>
<script src="data/names.js"></script>
<script src="js/map.js"></script>
<script src="js/realm.js"></script>
<script src="js/life.js"></script>
<script src="js/systems.js"></script>
<script src="js/events.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
