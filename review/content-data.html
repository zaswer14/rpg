  const src = fn.toString(), texts = [], fx = [], tone = [];

  if (/X\.money\((?!-)/.test(src)) fx.push('được bạc');

  for (const [, v] of src.matchAll(/S\.devotion \+ (\d+)/g)) fx.push(`Đức tin +${v}`);

  if (/X\.cond\('hunted'\)/.test(src)) fx.push('có thể bị săn đuổi');
  if (/flags\.wanted = \{\}|delete S\.flags\.wanted/.test(src)) fx.push('xóa truy nã');
  if (/flags\.debt/.test(src)) fx.push('thêm nợ');
  if (/relations\[/.test(src)) fx.push('quan hệ hai nước +1');
  if (/\.stab = Math\.max\(0, d\.stab - \.0(\d)\)/.test(src)) fx.push(`ổn định nước −${src.match(/d\.stab - \.0(\d)/)[1]}`);

  orgKinds: G.ORG_KINDS, advRanks: G.ADV_RANKS, headVi: G.HEAD_VI, officeVi: G.OFFICE_VI, orgCosts: G.ORG,
  edu: G.EDU.slice(1), tracks: G.TRACKS,
  nobleVi: G.NOBLE_VI, noble: G.NOBLE, nobleGovs: G.NOBLE_GOVS, originVi: G.ORIGIN_VI, dynastic: G.DYNASTIC,
  promo: pickF(G.PROMO, p => ({ names: p.names, thr: p.thr, unit: p.unit })),
  classes: G.CLASSES.slice(1).map(c => c.nameVi),
  works: G.WORKS, buildings: G.BUILDINGS,
  focus: pickF(G.FOCUS, f => f.nameVi),
  rarity: G.RARITY.map((r, i) => ({ id: r.id, nameVi: r.nameVi, col: r.col, w: r.w, rate: r.rate, root: G.ROOT_VI[i] })),
  talents: Object.values(G.TALENTS).map(t => ({ id: t.id, r: t.r, nameVi: t.nameVi, d: t.d, fx: G.fxText(t.fx) })),
  aims: pickF(G.AIMS, (a, k) => ({ nameVi: a.nameVi, icon: a.icon, d: a.d, trait: a.trait, focus: a.focus, works: a.works, schools: a.schools, dream: a.dream || null, side: a.side || null, sign: a.sign || null, chance: G.AIM_CHANCE[k] ? parseRun(G.AIM_CHANCE[k]).texts : [] })),
  // Sức mạnh: kỹ năng nghề, level, chỉ số, lắp kỹ năng, người dạy, thọ nguyên, tiền tệ (vankiep/js/cult.js, docs/08).
  cult: (() => {
    if (!G.jobs) G.init();
    const stTxt = rw => Object.entries(rw).map(([r, m]) => `bậc ${r}: ` + Object.entries(m).map(([s, n]) => `${G.STAT_VI[s]} +${n}`).join(', ')).join('; ');
    const acc = G.jobs.access.human, nm = id => (G.jobs.displayName('human', id) || {}).vi || G.jobs.byId[id].nameVi;
    const jobs = G.jobs.jobs.filter(j => ['native', 'foreign', 'origin'].includes(acc[j.id]) || j.id === L.races.human.origin.id).filter(j => !j.hidden && !j.faith).sort((a, b) => a.tier - b.tier)
      .map(j => ({ id: j.id, nameVi: nm(j.id), tier: j.tier, school: j.tier ? (L.schools[j.school] || {}).nameVi : 'nghề gốc', req: Object.entries(j.req || {}).map(([m, v]) => `${G.mv(m)} ${v}`).join(', '), trial: j.trial || '',
        next: G.succOf('human', j.id, null).map(d => nm(d.id)),
        skills: G.jobSkills('human', j.id, null).map(s => ({ name: G.skName(s.key), d: G.skDesc(s.key), m: G.mv(s.m), gate: s.gateFor.map(nm), rw: stTxt(G.skRewards(s.key, s.m)), named: !s.id.includes('#') })) }));
    const D1 = G.DECISIONS.cv_learn, D2 = G.DECISIONS.promote;
    // Bậc Tier, danh xưng, thăng hoa, trần chỉ số, cộng hưởng (docs/09).
    const kv = G.SK_KIND_VI, res = G.RESONANCE.map(r => ({ id: r.id, nameVi: r.nameVi, k: r.k, flee: r.flee || 0, guard: r.guard || 0, txt: r.txt,
      pair: r.same ? 'hai kỹ năng cùng mastery' : r.job ? 'hai kỹ năng cùng một nghề' : r.kinds[1] === '*' ? `${kv[r.kinds[0]]} + loại khác` : `${kv[r.kinds[0]]} + ${kv[r.kinds[1]]}` }));
    // Cây nghề riêng của Vạn Kiếp (data/jobtree.js, docs/10): nghề thêm, nghề đổi tên, lối lên thêm. Tên gốc lấy từ thư viện nghề.
    const orig = id => L.trunk.find(t => t.id === id) || Object.values(L.races).flatMap(r => r.crowns || []).find(c => c.id === id) || Object.values(L.faiths).flatMap(f => f.crowns || []).find(c => c.id === id);
    const jn = id => id === '@origin' ? 'xuất thân' : nm(id);
    const jobtree = { add: G.JOB_TREE.add.map(j => ({ id: j.id, tier: j.tier, nameVi: j.nameVi, school: (L.schools[j.school] || {}).nameVi, from: j.from.map(jn), req: Object.entries(j.req || {}).map(([m, v]) => `${G.mv(m)} ${v}`).join(', '), trial: j.trial, summary: j.summary,
        next: G.jobs.jobs.filter(x => x.from.includes(j.id)).map(x => nm(x.id)), gate: G.gatePair(j).map(k => G.skName(j.tier - 1 + ':' + k)) })),
      set: Object.entries(G.JOB_TREE.set).filter(([id]) => G.jobs.byId[id]).map(([id, s]) => ({ id, tier: G.jobs.byId[id].tier, old: (orig(id) || {}).nameVi || id, nameVi: G.jobs.byId[id].nameVi, addFrom: (s.addFrom || []).map(jn) })) };
    return { jobtree, tierName: G.TIER_NAME, ascend: G.ASCEND, cap: G.STAT_CAP, lifeF: G.LIFE_F, promoteCap: G.PROMOTE_CAP, mentorTier: G.MENTOR_TIER, res, kinds: kv,
      cost: G.SK_COST, cfg: G.CULT, list: G.SK_LIST, up: G.SK_UP, lvTier: G.LV_TIER, maxLv: G.MAX_LV, loadout: G.LOADOUT,
      stats: G.STATS.map(k => ({ id: k, nameVi: G.STAT_VI[k], ms: Object.keys(G.MASTERY_STAT).filter(m => G.MASTERY_STAT[m] === k).map(G.mv),
        main: Object.entries(G.SCHOOL_STAT).filter(([, v]) => v[0] === k).map(([s]) => L.schools[s].nameVi), sub: Object.entries(G.SCHOOL_STAT).filter(([, v]) => v[1] === k).map(([s]) => L.schools[s].nameVi),
        races: Object.entries(G.RACES).filter(([, R]) => (R.stat || {})[k]).map(([r, R]) => `${L.races[r].nameVi} ${R.stat[k] > 0 ? '+' : ''}${R.stat[k]}`) })),
      teachers: G.TEACHERS.map(t => ({ ...t, schools: Array.isArray(t.schools) ? t.schools.map(s => L.schools[s].nameVi).join(', ') : t.schools || 'mọi trường phái' })),
      jobs, named: Object.keys(L.skillRewards || {}).length,
      learn: { prio: D1.prio, ...parseRun(both(D1.build, D1.apply)) }, promote: { prio: D2.prio, ...parseRun(both(D2.build, D2.apply)) },
      coin: [0.35, 12.5, 245, 12000].map(n => [n, G.coin(n)]) };
  })(),
  tdecs: Object.entries(TDEC).map(([id, [title, when]]) => { const D = G.DECISIONS[id]; return { id, title, when, prio: D.prio, gap: D.gap, ...parseRun(both(D.build, D.apply)) }; }),
  // Địa vị theo Tier (vankiep/js/status.js, docs/09 mục 6.4, docs/07 mục 4.3 và 4.10).
  inst: { cfg: G.INST, bloodSchools: G.BLOOD_SCHOOLS.map(s => L.schools[s].nameVi), mine: { p: G.DYN.mineP, max: G.DYN.mineMax, yrs: G.DYN.mineYrs, wealth: G.DYN.mineWealth, war: G.DYN.mineWar },
    decs: Object.entries(DDEC).map(([id, [title, when]]) => { const D = G.DECISIONS[id]; return { id, title, when, ev: false, prio: D.prio, gap: D.gap, ...parseRun(both(D.build, D.apply)) }; }) },
  econ: { ringVi: G.RING_VI, demandVi: G.DEMAND_VI, cfg: G.ECON,
    decs: Object.entries(EDEC).map(([id, [title, when]]) => { const D = G.DECISIONS[id], E = G.EVENTS.find(e => e.id === id);
      return D ? { id, title, when, ev: false, prio: D.prio, gap: D.gap, ...parseRun(both(D.build, D.apply)) } : { id, title, when, ev: true, gap: E.gap || null, rep: !!E.rep, ...parseRun(E.run) }; }) },
  status: { st: G.STATUS, titleTier: G.TITLE_TIER, grace: G.TITLE_GRACE, head: G.HEAD_TIER, office: G.OFFICE_TIER, org: G.ORG_TIER, tw: G.PROMO_TW, ret: G.RET_PAY, elixir: G.ELIXIR, blood: G.BLOOD, strict: G.STRICT, lax: G.LAX,
    decs: Object.entries(SDEC).map(([id, [title, when]]) => { const D = G.DECISIONS[id], E = G.EVENTS.find(e => e.id === id);
      return D ? { id, title, when, ev: false, prio: D.prio, gap: D.gap, ...parseRun(both(D.build, D.apply)) } : { id, title, when, ev: true, gap: E.gap || null, rep: !!E.rep, ...parseRun(E.run) }; }) }
};
document.getElementById('out').textContent = JSON.stringify(data);
</script>
