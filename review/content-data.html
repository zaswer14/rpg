<!-- Sinh dữ liệu cho content-review.src.html (Duyệt Nội Dung Vạn Kiếp):
     msedge --headless --allow-file-access-from-files --dump-dom file:///<repo>/review/content-data.html

<script src="../vankiep/js/edu.js"></script><script src="../vankiep/js/noble.js"></script><script src="../vankiep/js/realmev.js"></script><script src="../vankiep/js/talent.js"></script><script src="../vankiep/js/cult.js"></script>
<pre id="out"></pre>
<script>
const L = JobLibrary, G = LifeSim;
// Tên và điều kiện của các sự kiện không gắn với mẫu hay đặc trưng (hàm điều kiện bị gói lại trong realmev.js nên ghi tay ở đây).
const COND = {
  vl_join: ['Xóm bên xin nhập', 'Bạn là trưởng một khu dân cư'],
  rl_envoy: ['Sứ thần', 'Bạn là người cai trị một nước còn tồn tại'],
  rl_heir: ['Con đòi kế vị', 'Bạn là người cai trị và có con đã trưởng thành'],
  rl_corrupt: ['Quan tham', 'Bạn là người cai trị'],
  rl_secede: ['Tỉnh đòi tách', 'Bạn là người cai trị, nước có ổn định dưới 45%'],
  nt_skhome: ['Quê cũ đổi chủ', 'Bộ Xương; quê cũ đã đổi chủ'],
  nt_amnesty: ['Ân xá', 'Bạn đang bị truy nã ở nước mình sống'],
  nt_faith_feast: ['Lễ quốc giáo', 'Nước có quốc giáo và bạn theo đạo đó'],
  nt_history: ['Nhắc lại sử', 'Thế giới có dòng biên niên từ trước năm bạn sinh']
};
// Biểu thức ${…} trong câu: thay bằng nhãn dễ đọc.
const slot = e => /^[gfcn]$|gear/.test(e) ? '‹số›' : e === 'h.y' ? '‹năm›' : e === 'h.t' ? '‹dòng sử›' : /prophecy/.test(e) ? '‹lời tiên tri›'
  : /faith/.test(e) && /nameVi/.test(e) ? '‹tên đạo›' : /WORKS|\bw\.nameVi|cur\b/.test(e) ? '‹nghề›' : /AIMS|A\.dream/.test(e) ? '‹chí hướng›'
  : /RARITY|rarityOf|\br\.nameVi/.test(e) ? '‹bậc màu›' : /TALENTS|\bt\.nameVi/.test(e) ? '‹thiên phú›' : /\bz\b/.test(e) ? '‹khu›'
  : /rootText/.test(e) ? '‹căn cốt›' : /talText/.test(e) ? '‹căn cốt, thiên phú›' : /homeName/.test(e) ? '‹làng›' : /ruler/.test(e) ? '‹người cai trị›' : /kid\.name/.test(e) ? '‹tên con›' : /name/.test(e) ? '‹tên›' : '‹…›';
const STAT = { hl: 'Sinh lực', h: 'Tâm trạng', so: 'Quan hệ', sm: 'Hiểu biết' };
function parseRun(fn) {
  const src = fn.toString(), texts = [], fx = [], tone = [];
  const re = /(['`])((?:\\.|(?!\1)[^\\])*)\1/g; let m;
  while ((m = re.exec(src))) {
    const s = m[2].replace(/\$\{([^{}]*)\}/g, (_, e) => slot(e.trim()));
    if (/^(good|bad|info|big)$/.test(s)) { if (!tone.includes(s)) tone.push(s); continue; }
    if (s.length >= 12 && / /.test(s) && !texts.includes(s)) texts.push(s);
  }
  for (const [, k, v] of src.matchAll(/X\.add\('(\w+)',\s*([^)]+)\)/g)) fx.push(`${STAT[k] || k} ${/^-?[\d.]+$/.test(v.trim()) ? (+v > 0 ? '+' : '') + v.trim() : '±'}`);
  for (const [, k, v] of src.matchAll(/X\.gain\('(\w+)',\s*(\d+)\)/g)) fx.push(`${G.MASTERY_VI[k] || k} +${v}`);
  if (/X\.money\(-/.test(src) || /S\.gold = Math\.round\(S\.gold \*/.test(src)) fx.push('mất bạc');
  if (/X\.money\((?!-)/.test(src)) fx.push('được bạc');
  for (const [, v] of src.matchAll(/S\.fame \+= (\d+)/g)) fx.push(`Danh vọng +${v}`);
  for (const [, v] of src.matchAll(/S\.devotion \+ (\d+)/g)) fx.push(`Đức tin +${v}`);
  if (/S\.gear\+\+/.test(src)) fx.push('Trang bị +1');
  if (/X\.fight\(/.test(src)) fx.push('đánh một trận với quái');
  if (/X\.cond\('hunted'\)/.test(src)) fx.push('có thể bị săn đuổi');
  if (/flags\.wanted = \{\}|delete S\.flags\.wanted/.test(src)) fx.push('xóa truy nã');
  if (/flags\.debt/.test(src)) fx.push('thêm nợ');
  if (/relations\[/.test(src)) fx.push('quan hệ hai nước +1');
  if (/\.stab = Math\.max\(0, d\.stab - \.0(\d)\)/.test(src)) fx.push(`ổn định nước −${src.match(/d\.stab - \.0(\d)/)[1]}`);
  if (/setField\(.*'urban'/.test(src)) fx.push('khu thêm dân');
  return { texts, fx: [...new Set(fx)], tone };
}
const events = G.NATION_EVENTS.map(e => {
  const kind = e.id.startsWith('tpl_') ? 'tpl' : e.id.startsWith('qk_') ? 'quirk' : 'misc', ref = e.id.replace(/^(tpl_|qk_)/, '');
  return { id: e.id, kind, ref, st: e.st, w: typeof e.w === 'number' ? e.w : null, rep: !!e.rep, gap: e.gap || null,
    undead: e.undead === true ? 'only' : e.undead === 'any' ? 'any' : 'none', title: COND[e.id] ? COND[e.id][0] : null, cond: COND[e.id] ? COND[e.id][1] : null, ...parseRun(e.run) };
});
// Thiên phú, chí hướng (vankiep/js/talent.js): tên và điều kiện của quyết định ghi tay (build dựng câu theo trạng thái), câu chữ trích từ build + apply.
const TDEC = {
  aim_pick: ['Chí hướng', 'Tuổi thiếu niên, chưa đặt chí hướng (đã chọn ở ô Chí hướng thì không hỏi). Gợi ý 4 chí hướng hợp tính cách, thiên phú, xuất thân nhất.'],
  aim_defy: ['Nối nghiệp nhà', 'Nhà Cùng khổ hoặc Nông hộ ở quê, cha mẹ còn sống, chưa có nghề, chí hướng không phải Gia đình hay Thuận theo tự nhiên. Một lần một đời.'],
  aim_job: ['Đổi nghề?', 'Trưởng thành, nghề đang làm lệch chí hướng; hoặc chí hướng Thuận theo tự nhiên mà Tâm trạng dưới 30. Ba năm hỏi một lần.'],
  aim_chance: ['Cơ hội theo chí hướng', 'Sự kiện báo tin (trọng số 1,5, cách 5 năm) gieo cờ, quyết định mở năm sau. Câu chữ từng chí hướng ở tab Chí hướng.'],
  tal_awaken: ['Thiên phú thức tỉnh', 'Mỗi lượt 0,6%, cộng 1,5% nếu đêm sinh có sao chổi, 6% nếu Sinh lực dưới 22, thêm theo thời gian Tu hành / Luyện tập. Chào 3 thiên phú, bậc nghiêng lên; tối đa 5.'],
  tal_break: ['Bình cảnh', 'Chạm mỗi Tier cảnh giới (1 → 5, js/cult.js), mỗi mốc một lần, căn cốt chưa phải Đỏ. Thuốc tẩy tủy 62% (giảm 9 điểm mỗi bậc), bế quan 30% (giảm 5 điểm mỗi bậc, cộng theo tính chăm).']
};
const both = (...fs) => ({ toString: () => fs.map(f => f.toString()).join('\n') });
const pickF = (o, f) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, f(v, k)]));
const data = {
  races: pickF(L.races, r => r.nameVi),
  faiths: pickF(L.faiths, f => f.nameVi),
  schools: pickF(L.schools, s => ({ vi: s.nameVi, masteries: s.masteries })),
  biomes: pickF(L.biomes, b => b.nameVi),
  mastery: G.MASTERY_VI,
  causes: pickF(G.CAUSES, c => c.nameVi),
  govs: pickF(G.GOVS, g => ({ vi: g.nameVi, promo: g.promo })),
  laws: pickF(G.LAWS, l => l.nameVi),
  templates: G.NATION_TEMPLATES.map(t => ({ id: t.id, race: t.race, label: t.label, trait: t.trait })),
  quirks: G.QUIRKS.map(q => ({ id: q.id, nameVi: q.nameVi, group: q.group })),
  events,
  orgKinds: G.ORG_KINDS, advRanks: G.ADV_RANKS, headVi: G.HEAD_VI, officeVi: G.OFFICE_VI, orgCosts: G.ORG,
  edu: G.EDU.slice(1), tracks: G.TRACKS,
  nobleVi: G.NOBLE_VI, noble: G.NOBLE, nobleGovs: G.NOBLE_GOVS, originVi: G.ORIGIN_VI, dynastic: G.DYNASTIC,
  promo: pickF(G.PROMO, p => ({ names: p.names, thr: p.thr, unit: p.unit })),
  classes: G.CLASSES.slice(1).map(c => c.nameVi),
  works: G.WORKS, buildings: G.BUILDINGS,
  focus: pickF(G.FOCUS, f => f.nameVi),
  rarity: G.RARITY.map((r, i) => ({ id: r.id, nameVi: r.nameVi, col: r.col, w: r.w, rate: r.rate, root: G.ROOT_VI[i] })),
  talents: Object.values(G.TALENTS).map(t => ({ id: t.id, r: t.r, nameVi: t.nameVi, d: t.d, fx: G.fxText(t.fx) })),
  aims: pickF(G.AIMS, (a, k) => ({ nameVi: a.nameVi, icon: a.icon, d: a.d, trait: a.trait, focus: a.focus, works: a.works, schools: a.schools, dream: a.dream || null, side: a.side || null, sign: a.sign || null, chance: G.AIM_CHANCE[k] ? parseRun(G.AIM_CHANCE[k]).texts : [] })),
  // Sức mạnh: kỹ năng nghề, level, chỉ số, lắp kỹ năng, người dạy, thọ nguyên, tiền tệ (vankiep/js/cult.js, docs/08).
  cult: (() => {
    if (!G.jobs) G.init();
    const stTxt = rw => Object.entries(rw).map(([r, m]) => `bậc ${r}: ` + Object.entries(m).map(([s, n]) => `${G.STAT_VI[s]} +${n}`).join(', ')).join('; ');
    const acc = G.jobs.access.human, nm = id => (G.jobs.displayName('human', id) || {}).vi || G.jobs.byId[id].nameVi;
    const jobs = G.jobs.jobs.filter(j => ['native', 'foreign', 'origin'].includes(acc[j.id]) || j.id === L.races.human.origin.id).filter(j => !j.hidden && !j.faith).sort((a, b) => a.tier - b.tier)
      .map(j => ({ id: j.id, nameVi: nm(j.id), tier: j.tier, school: j.tier ? (L.schools[j.school] || {}).nameVi : 'nghề gốc', req: Object.entries(j.req || {}).map(([m, v]) => `${G.mv(m)} ${v}`).join(', '), trial: j.trial || '',
        next: G.succOf('human', j.id, null).map(d => nm(d.id)),
        skills: G.jobSkills('human', j.id, null).map(s => ({ name: G.skName(s.key), d: G.skDesc(s.key), m: G.mv(s.m), gate: s.gateFor.map(nm), rw: stTxt(G.skRewards(s.key, s.m)), named: !s.id.includes('#') })) }));
    const D1 = G.DECISIONS.cv_learn, D2 = G.DECISIONS.promote;
    return { cost: G.SK_COST, cfg: G.CULT, list: G.SK_LIST, up: G.SK_UP, lvTier: G.LV_TIER, maxLv: G.MAX_LV, loadout: G.LOADOUT,
      stats: G.STATS.map(k => ({ id: k, nameVi: G.STAT_VI[k], ms: Object.keys(G.MASTERY_STAT).filter(m => G.MASTERY_STAT[m] === k).map(G.mv),
        main: Object.entries(G.SCHOOL_STAT).filter(([, v]) => v[0] === k).map(([s]) => L.schools[s].nameVi), sub: Object.entries(G.SCHOOL_STAT).filter(([, v]) => v[1] === k).map(([s]) => L.schools[s].nameVi),
        races: Object.entries(G.RACES).filter(([, R]) => (R.stat || {})[k]).map(([r, R]) => `${L.races[r].nameVi} ${R.stat[k] > 0 ? '+' : ''}${R.stat[k]}`) })),
      teachers: G.TEACHERS.map(t => ({ ...t, schools: Array.isArray(t.schools) ? t.schools.map(s => L.schools[s].nameVi).join(', ') : t.schools || 'mọi trường phái' })),
      jobs, named: Object.keys(L.skillRewards || {}).length,
      learn: { prio: D1.prio, ...parseRun(both(D1.build, D1.apply)) }, promote: { prio: D2.prio, ...parseRun(both(D2.build, D2.apply)) },
      coin: [0.35, 12.5, 245, 12000].map(n => [n, G.coin(n)]) };
  })(),
  tdecs: Object.entries(TDEC).map(([id, [title, when]]) => { const D = G.DECISIONS[id]; return { id, title, when, prio: D.prio, gap: D.gap, ...parseRun(both(D.build, D.apply)) }; })
};
document.getElementById('out').textContent = JSON.stringify(data);
</script>
