<pre id="out"></pre>
<script>
const L = JobLibrary, G = LifeSim;
// Biểu thức ${…} trong câu: thay bằng nhãn dễ đọc.
const slot = e => /tierName/.test(e) ? '‹danh xưng›' : /^G\.coin\(/.test(e) ? '‹tiền›' : /NOBLE_VI/.test(e) ? '‹tước›' : /^[gfcn]$|gear/.test(e) ? '‹số›' : e === 'h.y' ? '‹năm›' : e === 'h.t' ? '‹dòng sử›' : /prophecy/.test(e) ? '‹lời tiên tri›'
  : /faith/.test(e) && /nameVi/.test(e) ? '‹tên đạo›' : /WORKS|\bw\.nameVi|cur\b/.test(e) ? '‹nghề›' : /AIMS|A\.dream/.test(e) ? '‹chí hướng›'
  : /RARITY|rarityOf|\br\.nameVi/.test(e) ? '‹bậc màu›' : /TALENTS|\bt\.nameVi/.test(e) ? '‹thiên phú›' : /\bz\b/.test(e) ? '‹khu›'
  : /rootText/.test(e) ? '‹căn cốt›' : /talText/.test(e) ? '‹căn cốt, thiên phú›' : /homeName/.test(e) ? '‹làng›' : /ruler/.test(e) ? '‹người cai trị›' : /kid\.name/.test(e) ? '‹tên con›' : /name/.test(e) ? '‹tên›' : '‹…›';
const STAT = { hl: 'Sinh lực', h: 'Tâm trạng', so: 'Quan hệ', sm: 'Hiểu biết' };
function parseRun(fn) {
  const src = fn.toString(), texts = [], fx = [], tone = [];
  const re = /(['`])((?:\\.|(?!\1)[^\\])*)\1/g; let m;
  while ((m = re.exec(src))) {
    const s = m[2].replace(/\$\{([^{}]*)\}/g, (_, e) => slot(e.trim()));
    if (/^(good|bad|info|big)$/.test(s)) { if (!tone.includes(s)) tone.push(s); continue; }
    if (s.length >= 12 && / /.test(s) && !texts.includes(s)) texts.push(s);
  }
  for (const [, k, v] of src.matchAll(/X\.add\('(\w+)',\s*([^)]+)\)/g)) fx.push(`${STAT[k] || k} ${/^-?[\d.]+$/.test(v.trim()) ? (+v > 0 ? '+' : '') + v.trim() : '±'}`);
  for (const [, k, v] of src.matchAll(/X\.gain\('(\w+)',\s*(\d+)\)/g)) fx.push(`${G.MASTERY_VI[k] || k} +${v}`);
  if (/X\.money\(-/.test(src) || /S\.gold = Math\.round\(S\.gold \*/.test(src)) fx.push('mất bạc');
  if (/X\.money\((?!-)/.test(src)) fx.push('được bạc');
  for (const [, v] of src.matchAll(/S\.fame \+= (\d+)/g)) fx.push(`Danh vọng +${v}`);
  for (const [, v] of src.matchAll(/S\.devotion \+ (\d+)/g)) fx.push(`Đức tin +${v}`);
  for (const [, v] of src.matchAll(/\bdev\(S, (\d+)\)/g)) fx.push(`Đức tin +${v}`);   // culture.js: dev(S, n)
  if (/S\.gear\+\+/.test(src)) fx.push('Trang bị +1');
  if (/X\.fight\(/.test(src)) fx.push('đánh một trận với quái');
  if (/X\.cond\('hunted'\)/.test(src)) fx.push('có thể bị săn đuổi');
  if (/flags\.wanted = \{\}|delete S\.flags\.wanted/.test(src)) fx.push('xóa truy nã');
  if (/flags\.debt/.test(src)) fx.push('thêm nợ');
  if (/relations\[/.test(src)) fx.push('quan hệ hai nước +1');
  if (/\.stab = Math\.max\(0, d\.stab - \.0(\d)\)/.test(src)) fx.push(`ổn định nước −${src.match(/d\.stab - \.0(\d)/)[1]}`);
  if (/setField\(.*'urban'/.test(src)) fx.push('khu thêm dân');
  return { texts, fx: [...new Set(fx)], tone };
}
// Mã nguồn để trích câu chữ: hàm thì lấy mã, bảng (def.texts của mạch: kẻ thù của Món nợ máu, kịch bản thử thách…) thì duyệt sâu, chuỗi bọc trong dấu `.
const srcOf = x => typeof x === 'function' ? x.toString() : typeof x === 'string' ? '`' + x + '`' : Array.isArray(x) ? x.map(srcOf).join('\n')
  : x && typeof x === 'object' ? Object.entries(x).map(([k, v]) => k + ': ' + srcOf(v)).join('\n') : '';
const both = (...fs) => ({ toString: () => fs.filter(Boolean).map(srcOf).join('\n') });
const labels = fn => [...String(fn).matchAll(/label: ['`]([^'`]+)['`]/g)].map(m => m[1]);
const P = { name: '‹người›' }, REC = { d: { kin: '‹người thân›', fv: '‹đạo›', t0: 0 } };
const sumText = (k, o) => { try { return G.ARCS[k].sum ? G.ARCS[k].sum(o, P, REC) || null : null; } catch (e) { return null; } };
const sumKeys = k => { const D = G.ARCS[k]; return D.sum ? [...D.sum.toString().matchAll(/\b([a-z_]+): [`(]/g)].map(m => m[1]) : []; };
const evById = id => G.EVENTS.find(e => e.id === id);
const opensOf = k => {
  const pat = "arcOpen(S, X, '" + k + "'", re = { test: s => s.includes(pat) }, out = [];
  for (const h of G.STORY_HOOKS || []) if (re.test(h.fn.toString())) out.push((h.dec ? 'quyết định ' : '') + h.id);
  for (const e of G.EVENTS) if (!e.story && re.test(e.run.toString())) out.push(e.id);
  return [...new Set(out)];
};
const nodeOf = (id, kind, s, extra) => ({ id, kind, at: [].concat(s.at || 'open'), wait: s.wait || null, ...extra });
// Khuôn đầy đủ (js/saga.js full()): mọi mạch 5 hồi; khoảng chờ mặc định là của mạch chính, mạch khác ghi trong def.acts.
const WAIT0 = { open: [0, 30], knot: [2, 40], trial: [3, 40], climax: [3, 60], after: [4, 80] };
const waitOf = (d, at) => (d.acts && d.acts[at] && d.acts[at].wait) || WAIT0[at];
const rule = f => (f ? f.toString().replace(/\s+/g, ' ').slice(0, 500) : null);
const arcs = [];
for (const [k, A] of Object.entries(G.ARCS)) {
  const tier = A.tier || 'arc', main = G.SAGA[k], F = G.ARC_FULL[k], sh = F && F.from ? F : null;
  const outs = [...new Set([...(A.good || []), ...Object.keys(A.marks || {}), ...(F ? Object.keys(F.after) : sumKeys(k))])];
  const outcomes = outs.map(o => ({ o, good: (A.good || []).includes(o), sum: sumText(k, o), mark: (A.marks || {})[o] || null }));
  let nodes;
  if (F) {
    const d = F, T = d.texts || {};
    const knotSrc = both(d.knot.choices, T.knot), climSrc = both(d.climax.choices, T.climax);
    nodes = [
      nodeOf(k + '_open', 'ev', { at: 'open', wait: waitOf(d, 'open') }, parseRun(both(d.open, T.open))),
      nodeOf(k + '_knot', 'dec', { at: 'knot', wait: waitOf(d, 'knot') }, { title: d.knot.title, choices: [...new Set(labels(knotSrc))], ...parseRun(both(d.knot.body, d.knot.choices, d.knot.apply, T.knot)) }),
      nodeOf(k + '_trial', 'ev', { at: 'trial', wait: waitOf(d, 'trial') }, parseRun(both(d.trial.run, T.trial))),
      nodeOf(k + '_climax', 'dec', { at: 'climax', wait: waitOf(d, 'climax') }, { title: d.climax.title, choices: [...new Set(labels(climSrc))], ...parseRun(both(d.climax.body, d.climax.choices, d.climax.apply, T.climax)) }),
      ...(d.climax.bg ? [nodeOf(k + '_drift', 'ev', { at: 'climax', wait: waitOf(d, 'climax') }, { bg: true, ...parseRun(d.climax.bg) })] : []),
      nodeOf(k + '_after', 'ev', { at: 'after', wait: waitOf(d, 'after') }, parseRun(both(...Object.values(d.after), T.after))),
      ...(d.beat ? [nodeOf(k + '_beat', 'ev', { at: ['open', 'knot', 'trial', 'climax'], wait: main ? [1, 99] : [1, 12] }, { beat: true, texts: [...new Set([...Object.values(d.beat).flat(), ...(T.beat || []).flat()])], fx: [] })] : [])
    ];
    // Nút thêm của mạch ngoài khuôn 5 hồi (vd. m_rise_kin: cảnh người nhà trên đường Thoát nghèo).
    const std = new Set(nodes.map(n => n.id));
    for (const e of G.EVENTS) if (e.story && e.story.arc === k && !std.has(e.id)) nodes.push(nodeOf(e.id, 'ev', e.story, { w: e.wSt ?? null, ...parseRun(e.run) }));
  } else {
    nodes = [];
    for (const e of G.EVENTS) if (e.story && e.story.arc === k) nodes.push(nodeOf(e.id, 'ev', e.story, { w: e.wSt ?? null, ...parseRun(e.run) }));
    for (const [id, D] of Object.entries(G.DECISIONS)) if (D.story && D.story.arc === k) nodes.push(nodeOf(id, 'dec', D.story, { choices: labels(D.build), ...parseRun(both(D.build, D.apply)) }));
  }
  arcs.push({ id: k, tier, nameVi: A.nameVi, passive: !!A.passive, pitch: main ? main.pitch : null, quest: A.quest ? (() => { try { return A.quest(P, REC); } catch (e) { return null; } })() : null,
    axes: main ? main.axes : null, themes: main ? main.themes : null, aim: main ? main.aim : null, follow: main ? main.follow : null,
    opens: main ? Object.entries(G.SAGA_SEED).filter(([, v]) => (v[k] || 0) > 0).sort((a, b) => b[1][k] - a[1][k]).map(([id, v]) => [id, v[k]]) : sh ? [`quyết định ${sh.from} (${Math.round(sh.p * 100)}%)`] : opensOf(k),
    away: !!(F && /ch\('away'/.test(F.knot.choices.toString())), endRule: F ? rule(F.end) : null, variants: F && F.variants ? F.variants : null, outcomes, nodes });
}
const markSrc = {};
for (const a of arcs) for (const o of a.outcomes) if (o.mark) (markSrc[o.mark] = markSrc[o.mark] || []).push(`${a.nameVi}: ${o.sum || o.o}`);
const marks = Object.fromEntries(Object.entries(G.MARKS).map(([id, M]) => [id, { nameVi: M.nameVi, tone: M.tone, fade: M.fade, d: M.d, w: Object.entries(M.w || {}), echo: M.echo || {},
  yr: M.yr ? parseRun(M.yr).fx.concat(/devotion/.test(M.yr.toString()) ? ['Đức tin +2'] : [], /X\.money\(Math\.round/.test(M.yr.toString()) ? ['được bạc'] : []) : [], on: M.on ? M.on.toString().replace(/\s+/g, ' ').slice(0, 160) : null, src: markSrc[id] || [] }]));
const evIds = new Set([...Object.keys(G.SAGA_SEED), ...G.SAGA_UNIVERSAL, ...Object.values(G.MARKS).flatMap(M => Object.keys(M.w || {}))]);
const evText = {};
for (const id of evIds) { const e = evById(id); if (!e) continue; const t = parseRun(e.run).texts[0]; evText[id] = t ? (t.length > 90 ? t.slice(0, 88) + '…' : t) : ''; }
const data = {
  cfg: G.SAGA_CFG, story: { arcMax: G.STORY.arcMax, pull: G.STORY.pull, mainK: G.STORY.mainK, late: G.STORY.late },
  stepVi: G.SAGA_STEP_VI, arcs, marks, seeds: G.SAGA_SEED, universal: [...G.SAGA_UNIVERSAL], evText,
  road: { ...parseRun(both(G.DECISIONS.sg_road.build, G.DECISIONS.sg_road.apply)), when: G.SAGA_TITLE.sg_road[1] },
  turn: { cfg: G.SAGA_TURN, when: G.SAGA_TITLE.sg_turn[1], chain: Object.entries(G.SAGA_CHAIN).flatMap(([k, O]) => Object.entries(O).map(([o, to]) => [G.SAGA[k].nameVi, o, Object.entries(to).map(([k2, v]) => [G.SAGA[k2].nameVi, v])])) },
  aims: Object.fromEntries(Object.entries(G.AIMS).map(([k, a]) => [k, a.nameVi]))
};
document.getElementById('out').textContent = JSON.stringify(data);
</script>
