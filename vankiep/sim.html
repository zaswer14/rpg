<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vạn Kiếp · Cân bằng</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }
  .bar2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=number] { width: 90px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  td, th { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  td.n, th.n { text-align: right; }
  .hbar { height: 8px; background: var(--gold); border-radius: 2px; }
  .ok { color: var(--good); } .no { color: var(--bad); }
  h2 { font: 700 18px "Cormorant Garamond", serif; color: var(--gold); margin: 0 0 6px; }
  .note { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1 style="font:700 28px 'Cormorant Garamond',serif;color:var(--gold);margin:0">Vạn Kiếp · Cân bằng headless</h1>
    <p class="note">Chạy N đời tự động tới chết (mọi quyết định do autoChoice), rồi in phân phối. Cùng seed gốc thì ra cùng kết quả. Dùng trước khi chỉnh số trong <code>data/world.js</code> hay <code>js/life.js</code>.</p>
  </div>
  <div class="bar2">
    <label>Số đời <input type="number" id="n" value="1000" min="10" max="20000"></label>
    <label>Seed gốc <input type="text" id="seed" value="can-bang" style="width:140px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px"></label>
    <label>Thế giới <input type="text" id="world" value="can-bang" style="width:120px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px"></label>
    <button class="btn" id="run">Chạy</button>
    <label>Số thế giới <input type="number" id="nw" value="100" min="5" max="1000"></label>
    <button class="btn" id="runWorlds">Thử nhiều thế giới</button>
    <label>Năm <input type="number" id="ny" value="300" min="50" max="2000"></label>
    <button class="btn" id="runHistory">Thử thế giới động</button>
    <span class="note" id="status"></span>
  </div>
  <div class="panel" id="checks"></div>
  <div class="grid" id="out"></div>
</div>

<script src="../shared/aspects.js"></script>
<script src="../shared/schools.js"></script>
<script src="../shared/trunk.js"></script>
<script src="../shared/races/human.js"></script>
<script src="../shared/races/elf.js"></script>
<script src="../shared/races/dwarf.js"></script>
<script src="../shared/races/orc.js"></script>
<script src="../shared/races/beastfolk.js"></script>

<script src="../shared/races/dragonkin.js"></script>
<script src="../shared/races/construct.js"></script>
<script src="../shared/races/skeleton.js"></script>
<script src="../shared/faiths.js"></script>
<script src="../shared/compose.js"></script>
<script src="../shared/skills.js"></script>
<script src="../shared/bestiary/rules.js"></script>
<script src="../shared/bestiary/species.js"></script>
<script src="../shared/bestiary/biomes.js"></script>
<script src="../shared/bestiary/bestiary.js"></script>
<script src="../shared/terrain/ecology.js"></script>
<script src="../shared/terrain/terrain.js"></script>
<script src="../shared/names/names.js"></script>
<script src="js/core.js"></script>
<script src="data/world.js"></script>
<script src="data/nations.js"></script>
<script src="data/skills.js"></script>
<script src="js/map.js"></script>
<script src="js/realm.js"></script>
<script src="js/life.js"></script>
<script src="js/systems.js"></script>
<script src="js/events.js"></script>
<script src="js/state.js"></script>
<script src="js/travel.js"></script>

<script src="js/edu.js"></script>

<script>
const G = LifeSim.init(), J = JobLibrary, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// Kiểm tra dữ liệu + tóm tắt thế giới đang chọn (js/realm.js).
function showChecks() {
  const RL = G.useWorld($('world').value || 'can-bang'), st = RL.stats;
  G.bindWorld({ dyn: G.newDyn(RL) });   // bảng dưới là thế giới lúc dựng (realm có thể đang mang trạng thái của đời chạy trước)
  const nrow = n => { const own = RL.settlements.filter(s => s.nation === n.idx && s.tier !== 'ruin'), pop = RL.provinces.filter(p => p.nation === n.idx).reduce((a, p) => a + p.pop, 0), urb = own.reduce((a, s) => a + s.urban, 0);
    return `<tr><td><span style="color:${n.color}">■</span> ${esc(n.name)}</td><td>${n.template} ${esc(n.label)}</td><td class="n">${n.size}</td><td class="n">${RL.provinces.filter(p => p.nation === n.idx).length}</td><td class="n">${own.length}</td><td class="n">${pop.toLocaleString('vi')}</td><td class="n">${(urb / Math.max(1, pop) * 100).toFixed(0)}%</td></tr>`; };
  $('checks').innerHTML = `<h2>Kiểm tra dữ liệu</h2>` +
    (G.check.errors.length ? G.check.errors.map(e => `<div class="no">✗ ${esc(e)}</div>`).join('') : '<div class="ok">✓ Không có lỗi (bestiary + compose + đại lục).</div>') +
    G.check.warnings.map(w => `<div class="note">⚠ ${esc(w)}</div>`).join('') +
    (RL.check.errors.length ? RL.check.errors.map(e => `<div class="no">✗ thế giới: ${esc(e)}</div>`).join('') : `<div class="ok">✓ Thế giới "${esc(RL.seed)}" không có lỗi.</div>`) +
    RL.check.warnings.map(w => `<div class="note">⚠ thế giới: ${esc(w)}</div>`).join('') +
    `<div class="note">${G.REGIONS.length} vùng · ${G.REGIONS.length * 4} khu · ${G.B.stat.species} loài (${G.B.stat.spawnable} sinh ngẫu nhiên) · ${G.jobs.jobs.length} nghề · ${Object.keys(G.EVENTS).length} sự kiện · ${Object.keys(G.DECISIONS).length} quyết định</div>` +
    `<div class="note">Thế giới: ${st.nations} nước · ${st.provinces} tỉnh · ${st.settlements} khu dân cư (${Object.entries(st.byTier).map(([t, k]) => `${k} ${G.TIER_VI[t].toLowerCase()}`).join(', ')}) · dân ${st.pop.toLocaleString('vi')} · đô thị ${(st.urbanShare * 100).toFixed(1)}% · đất vô chủ ${(st.unclaimed * 100).toFixed(0)}% · đường: ${st.roads[2]} ô đường cái, ${st.roads[1]} ô đường mòn, ${st.roads[0]} ô lối nhỏ, ${st.bridges} ô cầu, ${st.passes} ô đèo · tầng (diện tích đất): ${st.bands.map((v, b) => `${G.BAND_VI[b].toLowerCase()} ${(v * 100).toFixed(0)}%`).join(', ')} · ${RL.dungeons.length} di tích (${RL.dungeons.map(d => esc(d.name)).join(', ')}) · ${RL.nests.length} ổ chúa</div>` +
    `<table><tr><th>Nước</th><th>Mẫu</th><th class="n">Cỡ</th><th class="n">Tỉnh</th><th class="n">Khu</th><th class="n">Dân</th><th class="n">Đô thị</th></tr>${RL.nations.map(nrow).join('')}</table>`;
}
showChecks();
$('world').onchange = showChecks;

function table(title, rows, cols, opt = {}) {
  const max = Math.max(...rows.map(r => +r[opt.barCol ?? 1] || 0), 1);
  return `<div class="panel"><h2>${title}</h2><table><tr>${cols.map((c, i) => `<th class="${i ? 'n' : ''}">${c}</th>`).join('')}${opt.bar ? '<th></th>' : ''}</tr>` +
    rows.map(r => `<tr>${r.map((v, i) => `<td class="${i ? 'n' : ''}">${esc(v)}</td>`).join('')}${opt.bar ? `<td style="width:30%"><div class="hbar" style="width:${(+r[opt.barCol ?? 1] || 0) / max * 100}%"></div></td>` : ''}</tr>`).join('') + `</table>${opt.note ? `<p class="note">${opt.note}</p>` : ''}</div>`;
}

$('run').onclick = () => {
  const N = Math.max(10, +$('n').value || 1000), base = $('seed').value || 'can-bang';
  showChecks();
  $('status').textContent = 'Đang chạy…';
  // Chạy từng đợt 25 đời rồi nhả luồng: trang không treo, hiện được tiến độ.
  setTimeout(async () => {
    const t0 = performance.now();
    const ORIGK = ['royalMain', 'royalSide', 'royalCrown', 'royalExile', 'claimWin', 'claimFail', 'nobleHeirBorn', 'nobleInherit', 'nobleRoyal', 'promo', 'duel', 'duelWin'];
    const EDUK = ['edu1', 'grad1', 'edu2', 'grad2', 'edu3', 'grad3', 'eduGrant', 'eduDrop', 'eduFail2', 'eduFail3', 'mentorCraft', 'mentorMartial', 'mentorDone', 'discipleTake', 'discipleDone', 'nobleBorn', 'nobleInherit', 'nobleMerit', 'nobleBuy', 'nobleLost'];
    const TALK = ['talAwaken', 'talBreak', 'defy_stay', 'defy_both', 'defy_leave', 'workSwitch', 'toAdv', 'aimChance', 'hermit', 'tradeWin', 'askWin'];
    const ORGK = ['advJoin', 'quests', 'advBranch', 'orgJoin', 'mercJoin', 'mercC', 'orgOfficer', 'orgLead', 'orgFound', 'headElect', 'foundVillage', 'foundTown', 'upTown', 'upCity', 'office', 'office2', 'foundNation', 'rebelOK', 'rebelFail'];
    const A = { tal: { byRoot: {}, end: {}, aim: {}, k: {}, n: {}, nTal: 0 }, dyn: { years: 0, wars: 0, flips: 0, ruins: 0, founded: 0, rebel: 0, newNat: 0, fell: 0, warDeaths: 0, soldiers: 0, soldierDeaths: 0, homeFlip: 0 }, org: { adults: 0, k: {} }, edu: { k: {}, byQ: {}, rank: {} }, orig: { k: {}, promo: {}, ev: {} }, lair: { sum: 0, yrs: 0, made: 0, npc: 0, raid: 0, prov: 0, lives: 0, tries: 0, cleared: 0, dgLives: 0, dgTries: 0, floors: 0, fights: 0, over: 0, deaths: 0 }, lives: [], causes: {}, gaps: {}, byRace: {}, byWork: {}, maxTier: {}, jobTier: {}, rose: 0, chain: 0, region: {}, zoneVisits: {}, gapByZone: {}, bornTier: {}, bornNation: {}, law: { crimes: 0, hanged: 0, served: 0, fled: 0, expelled: 0, wary: 0, fav: 0 }, trip: { lives: 0, trips: 0, roadDeaths: 0, escorts: 0 }, sea: { lives: 0, voyages: 0, fights: 0, storms: 0, wrecks: 0, pirates: 0, deaths: 0 } };
    for (let i = 0; i < N; i++) {
      if (i % 25 === 24) { $('status').textContent = `Đang chạy đời ${i + 1}/${N}…`; await new Promise(r => setTimeout(r, 0)); }
      const sim = new G.Sim({ seed: base + ':' + i, headless: true });
      sim.newLife({ noPeers: true });
      const q0 = sim.S.q;
      const y0 = sim.S.world.year, bornNat = G.nationOf(G.SET[sim.S.born.settlement]);
      sim.runToDeath();
      let S = sim.S;
      // Thế giới động trong đời này (mỗi đời một thế giới mới từ seed): đếm theo năm thế giới đã trôi (docs/03 mục 5.7).
      { const D = A.dyn, n = S.world.dyn.n; D.years += S.world.year - y0; D.wars += n.wars; D.flips += n.kept + n.rebel + n.join; D.ruins += n.ruins; D.founded += n.founded + n.revived; D.rebel += n.rebel; D.newNat += n.newNat; D.fell += n.fell;
        if (S.causeId === 'war') D.warDeaths++; if (S.flags.served) { D.soldiers++; if (S.causeId === 'war') D.soldierDeaths++; } if (S.flags.homeFlip) D.homeFlip++; }
      { const O = A.orig, F = S.flags; for (const k of ORIGK) if (F[k]) O.k[k] = (O.k[k] || 0) + 1; if (F.promoMax) O.promo[F.promoMax] = (O.promo[F.promoMax] || 0) + 1; for (const id of Object.keys(S.recent)) { const g = id.split('_')[0]; if (['tpl', 'qk', 'nt', 'rl', 'vl'].includes(g)) O.ev[g] = (O.ev[g] || 0) + 1; } }
      { const E = A.edu, F = S.flags; for (const k of EDUK) if (F[k]) E.k[k] = (E.k[k] || 0) + 1; const b = E.byQ[q0] || (E.byQ[q0] = [0, 0, 0, 0]); b[0]++; for (let l = 1; l <= (S.edu ? S.edu.lv : 0); l++) b[l]++; if (F.nobleMax) E.rank[F.nobleMax] = (E.rank[F.nobleMax] || 0) + 1; }
      { const O = A.org, F = S.flags; if (sim.years(S) >= G.RACES[S.race].adult) O.adults++; for (const k of ORGK) if (F[k]) O.k[k] = (O.k[k] || 0) + 1; }
      { const H = A.lair, n = S.world.dyn.n, F = S.flags; H.sum += n.lairSum || 0; H.yrs += n.lairYrs || 0; H.made += n.lairs || 0; H.npc += n.lairNpc || 0; H.raid += n.raidYrs || 0; H.prov += n.provYrs || 0;
        if (F.lairTries) H.lives++; H.tries += F.lairTries || 0; H.cleared += F.lairs || 0; if (F.dgTries) H.dgLives++; H.dgTries += F.dgTries || 0; H.floors += F.dgFloors || 0;
        H.fights += F.lairFights || 0; H.over += F.lairOver || 0; if (S.dead && F.inLair) H.deaths++; }
      { const T = A.tal, F = S.flags, r0 = F.root0 || '?', r1 = S.tal ? S.tal.root : '?', b = T.byRoot[r0] || (T.byRoot[r0] = [0, 0, 0, 0]);   // thiên phú, chí hướng (js/talent.js)
        b[0]++; b[1] += S.level; b[2] += sim.years(S); if (sim.ctier(S) >= 3) b[3]++; T.end[r1] = (T.end[r1] || 0) + 1;
        const ak = S.aim || 'free', a = T.aim[ak] || (T.aim[ak] = [0, 0, 0]); a[0]++; if (S.work === 'adventurer') a[1]++; a[2] += S.level;
        T.nTal += S.tal ? S.tal.list.length : 0; for (const k of TALK) if (F[k]) { T.k[k] = (T.k[k] || 0) + 1; T.n[k] = (T.n[k] || 0) + (typeof F[k] === 'number' ? F[k] : 1); } }
      const rec = { race: S.race, years: sim.years(S), turns: S.age, cause: S.causeId, level: S.level, tier: sim.ctier(S), job: sim.job(S).tier, work: S.work || '—', rose: !!S.rose, hunts: S.hunts,
        adult: sim.years(S) >= G.RACES[S.race].adult, teach: G.teachOf(S, G.schoolOf(S), sim.job(S)), stuck: G.stuck(S), powIn: S.flags.powIn, powMax: S.flags.powMax, mOver: S.flags.mOver };   // level, người dạy, sức theo Tier (js/cult.js, docs/08)
      A.lives.push(rec);
      A.causes[S.causeId] = (A.causes[S.causeId] || 0) + 1;
      for (const [g, n] of Object.entries(S.hunts.byGap)) A.gaps[g] = (A.gaps[g] || 0) + n;
      (A.byRace[S.race] = A.byRace[S.race] || []).push(rec);
      (A.byWork[rec.work] = A.byWork[rec.work] || []).push(rec);
      A.maxTier[rec.tier] = (A.maxTier[rec.tier] || 0) + 1;
      A.jobTier[rec.job] = (A.jobTier[rec.job] || 0) + 1;
      A.region[S.born.region] = (A.region[S.born.region] || 0) + 1;
      { const F = S.flags, L = A.law; if (F.crimes) L.crimes++; if (S.causeId === 'hanged') L.hanged++; if (F.served) L.served++; if (F.wanted) L.fled++; if (F.expelled) L.expelled++;
        const n = S.nation != null ? G.realm.nations[S.nation] : null; if (n && n.wary.includes(S.race)) L.wary++; if (n && n.fav.includes(S.race)) L.fav++; }
      { const T = A.trip, F = S.flags; if (F.trips) { T.lives++; T.trips += F.trips; } if (F.onRoad && S.dead) T.roadDeaths++; T.escorts += F.escorts || 0; }
      { const Q = A.sea, F = S.flags; if (F.voyages) { Q.lives++; Q.voyages += F.voyages; } Q.fights += F.seaFights || 0; Q.storms += F.storms || 0; Q.wrecks += F.wrecks || 0; Q.pirates += F.pirates || 0; if (S.dead && (F.atSea || S.causeId === 'shipwreck')) Q.deaths++; }
      { const bs = G.SET[S.born.settlement], key = bs ? (S.born.urban ? G.TIER_VI[bs.tier] + ' (trong khu)' : 'vùng quê quanh ' + G.TIER_VI[bs.tier].toLowerCase()) : '?'; A.bornTier[key] = (A.bornTier[key] || 0) + 1;
        const nk = bornNat ? bornNat.name : 'đất vô chủ'; A.bornNation[nk] = (A.bornNation[nk] || 0) + 1; }   // nước lúc sinh (tỉnh có thể đổi chủ trong đời)
      if (S.rose) {
        A.rose++;
        // Chạy luôn kiếp Bộ Xương để đo đời thứ hai.
        sim.rise(); sim.runToDeath(); S = sim.S; A.chain++;
        (A.byRace.skeleton = A.byRace.skeleton || []).push({ race: 'skeleton', years: sim.years(S), turns: S.age, cause: S.causeId, level: S.level, tier: sim.ctier(S), job: sim.job(S).tier, inh: S.inherited });
        A.causes['(xương) ' + S.causeId] = (A.causes['(xương) ' + S.causeId] || 0) + 1;
        for (const [g, n] of Object.entries(S.hunts.byGap)) A.gaps[g] = (A.gaps[g] || 0) + n;
      }
    }
    const ms = Math.round(performance.now() - t0);
    const avg = (a, f) => a.length ? (a.reduce((x, y) => x + f(y), 0) / a.length) : 0;
    const pct = (a, b) => (a / b * 100).toFixed(1) + '%';
    const out = [];
    const totalHunts = Object.values(A.gaps).reduce((a, b) => a + b, 0);
    const over = Object.entries(A.gaps).filter(([g]) => +g > 1).reduce((a, [, n]) => a + n, 0);
    out.push(table('Phân cấp: Tier quái − Tier nhân vật', Object.entries(A.gaps).sort((a, b) => a[0] - b[0]).map(([g, n]) => [(+g > 0 ? '+' : '') + g, n, pct(n, totalHunts)]), ['Chênh', 'Trận', '%'],
      { bar: true, note: over ? `<span class="no">✗ ${over} trận gặp quái cao hơn Tier + 1 (chỉ được phép khi bật Liều mạng).</span>` : `<span class="ok">✓ ${totalHunts} trận, không trận nào quá Tier + 1.</span>` }));
    out.push(table('Trỗi dậy thành Bộ Xương', [['Đời đầu đã chết', N], ['Trỗi dậy', A.rose], ['Tỉ lệ', pct(A.rose, N)], ['Mục tiêu', '20%']], ['', '']));
    const cn = c => { const sk = c.startsWith('(xương) '), id = sk ? c.slice(8) : c; return (sk ? '(Bộ Xương) ' : '') + (id === 'monster' ? 'tử trận trước quái' : (G.CAUSES[id] || { nameVi: id }).nameVi); };
    out.push(table('Nguyên nhân chết', Object.entries(A.causes).sort((a, b) => b[1] - a[1]).map(([c, n]) => [cn(c), n, pct(n, N + A.chain)]), ['Nguyên nhân', 'Số', '%'], { bar: true }));
    out.push(table('Theo chủng tộc', Object.entries(A.byRace).sort((a, b) => b[1].length - a[1].length).map(([r, l]) => [J.races[r].nameVi, l.length, avg(l, x => x.years).toFixed(0), avg(l, x => x.turns).toFixed(1), avg(l, x => x.level).toFixed(1)]),
      ['Chủng tộc', 'Đời', 'Tuổi TB (năm)', 'Lượt TB', 'Level TB'], { note: 'Lượt = năm / ypt. Bộ Xương: tuổi tính từ khi trỗi dậy.' }));
    out.push(table('Theo sinh kế', Object.entries(A.byWork).sort((a, b) => b[1].length - a[1].length).map(([w, l]) => [w === '—' ? '— (chết trước khi đi làm)' : G.WORKS[w].nameVi, l.length, avg(l, x => x.years).toFixed(0), avg(l, x => x.level).toFixed(1), pct(l.filter(x => x.cause === 'monster').length, l.length)]),
      ['Sinh kế', 'Đời', 'Tuổi TB', 'Level TB', 'Chết vì quái']));
    out.push(table('Tier sức mạnh cuối đời', Object.entries(A.maxTier).map(([t, n]) => ['T' + t, n, pct(n, N)]), ['Tier', 'Đời', '%'], { bar: true }));
    out.push(table('Tier nghề cuối đời', Object.entries(A.jobTier).map(([t, n]) => ['T' + t, n, pct(n, N)]), ['Nghề', 'Đời', '%'], { bar: true }));
    { const ad = A.lives.filter(r => r.adult), M = Math.max(1, ad.length), avgOf = (l, f) => l.length ? avg(l, f).toFixed(2) : '—';   // docs/08 mục 9: tháp Tier (docs/07 mục 6), level trong Tier, sức lúc vào Tier / ở max level

$('runWorlds').onclick = () => {

    const t0 = performance.now(), tpl = Object.fromEntries(G.NATION_TEMPLATES.map(t => [t.id, 0])), nN = {}, races = {};

    for (let w = 0; w < NW; w++) {
      if (w % 5 === 4) { $('status').textContent = `Đang tạo thế giới ${w + 1}/${NW}…`; await new Promise(r => setTimeout(r, 0)); }
      const RL = G.buildRealm(G.map, base + ':w' + w);
      for (const n of RL.nations) { tpl[n.template]++; races[n.race] = (races[n.race] || 0) + 1; }
      nN[RL.nations.length] = (nN[RL.nations.length] || 0) + 1;

      sets += RL.stats.settlements; urb += RL.stats.urbanShare; unc += RL.stats.unclaimed; prov += RL.stats.provinces;
    }
    const ms = Math.round(performance.now() - t0), pct = (a, b) => (a / b * 100).toFixed(1) + '%';
    const out = [];
    out.push(table(`${NW} thế giới`, [['Lỗi', errs], ['Cảnh báo', warns], ['Khu dân cư / thế giới', (sets / NW).toFixed(1)], ['Tỉnh / thế giới', (prov / NW).toFixed(1)], ['Tỉ lệ đô thị', pct(urb, NW)], ['Đất vô chủ', pct(unc, NW)], ['ms / thế giới', Math.round(ms / NW)]], ['', '']));
    out.push(table('Số nước', Object.entries(nN).map(([k, v]) => [k + ' nước', v, pct(v, NW)]), ['', 'Thế giới', '%'], { bar: true }));
    out.push(table('Chủng tộc làm chủ', Object.entries(races).sort((a, b) => b[1] - a[1]).map(([r, v]) => [J.races[r].nameVi, v, pct(v, NW)]), ['Chủng tộc', 'Nước', '% thế giới'], { bar: true }));
    const never = Object.entries(tpl).filter(([, v]) => !v).map(([k]) => k);
    out.push(table('Mẫu quốc gia', Object.entries(tpl).sort((a, b) => b[1] - a[1]).map(([id, v]) => [id + ' ' + G.NATION_TEMPLATES.find(t => t.id === id).label, v, pct(v, NW)]), ['Mẫu', 'Lần', '% thế giới'],
      { bar: true, note: never.length ? `Chưa bao giờ ra: ${never.join(', ')}` : 'Mẫu nào cũng ra ít nhất một lần.' }));
    $('out').innerHTML = out.join('');
    $('status').textContent = `${NW} thế giới trong ${ms} ms.`;
    G.useWorld($('world').value || 'can-bang');
  }, 30);
};
if (!/noauto/.test(location.search)) $('run').click();   // ?noauto: chỉ nạp, không tự chạy (thử từng phần trong console)
</script>
