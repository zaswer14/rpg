<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vạn Kiếp · Cân bằng</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }
  .bar2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=number] { width: 90px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  td, th { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  td.n, th.n { text-align: right; }
  .hbar { height: 8px; background: var(--gold); border-radius: 2px; }
  .ok { color: var(--good); } .no { color: var(--bad); }
  h2 { font: 700 18px "Cormorant Garamond", serif; color: var(--gold); margin: 0 0 6px; }
  .note { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1 style="font:700 28px 'Cormorant Garamond',serif;color:var(--gold);margin:0">Vạn Kiếp · Cân bằng headless</h1>
    <p class="note">Chạy N đời tự động tới chết (mọi quyết định do autoChoice), rồi in phân phối. Cùng seed gốc thì ra cùng kết quả. Dùng trước khi chỉnh số trong <code>data/world.js</code> hay <code>js/life.js</code>.</p>
  </div>
  <div class="bar2">
    <label>Số đời <input type="number" id="n" value="1000" min="10" max="20000"></label>
    <label>Seed gốc <input type="text" id="seed" value="can-bang" style="width:140px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px"></label>
    <label>Thế giới <input type="text" id="world" value="can-bang" style="width:120px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px"></label>
    <button class="btn" id="run">Chạy</button>
    <label>Số thế giới <input type="number" id="nw" value="100" min="5" max="1000"></label>
    <button class="btn" id="runWorlds">Thử nhiều thế giới</button>
    <label>Năm <input type="number" id="ny" value="300" min="50" max="2000"></label>
    <button class="btn" id="runHistory">Thử thế giới động</button>
    <span class="note" id="status"></span>
  </div>
  <div class="panel" id="checks"></div>
  <div class="grid" id="out"></div>
</div>

<script>
const G = LifeSim.init(), J = JobLibrary, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// Kiểm tra dữ liệu + tóm tắt thế giới đang chọn (js/realm.js).
function showChecks() {
  const RL = G.useWorld($('world').value || 'can-bang'), st = RL.stats;
  G.bindWorld({ dyn: G.newDyn(RL) });   // bảng dưới là thế giới lúc dựng (realm có thể đang mang trạng thái của đời chạy trước)
  const nrow = n => { const own = RL.settlements.filter(s => s.nation === n.idx && s.tier !== 'ruin'), pop = RL.provinces.filter(p => p.nation === n.idx).reduce((a, p) => a + p.pop, 0), urb = own.reduce((a, s) => a + s.urban, 0);
    return `<tr><td><span style="color:${n.color}">■</span> ${esc(n.name)}</td><td>${n.template} ${esc(n.label)}</td><td class="n">${n.size}</td><td class="n">${RL.provinces.filter(p => p.nation === n.idx).length}</td><td class="n">${own.length}</td><td class="n">${pop.toLocaleString('vi')}</td><td class="n">${(urb / Math.max(1, pop) * 100).toFixed(0)}%</td></tr>`; };
  $('checks').innerHTML = `<h2>Kiểm tra dữ liệu</h2>` +
    (G.check.errors.length ? G.check.errors.map(e => `<div class="no">✗ ${esc(e)}</div>`).join('') : '<div class="ok">✓ Không có lỗi (bestiary + compose + đại lục).</div>') +
    G.check.warnings.map(w => `<div class="note">⚠ ${esc(w)}</div>`).join('') +
    (RL.check.errors.length ? RL.check.errors.map(e => `<div class="no">✗ thế giới: ${esc(e)}</div>`).join('') : `<div class="ok">✓ Thế giới "${esc(RL.seed)}" không có lỗi.</div>`) +
    RL.check.warnings.map(w => `<div class="note">⚠ thế giới: ${esc(w)}</div>`).join('') +
    `<div class="note">${G.REGIONS.length} vùng · ${G.REGIONS.length * 4} khu · ${G.B.stat.species} loài (${G.B.stat.spawnable} sinh ngẫu nhiên) · ${G.jobs.jobs.length} nghề · ${Object.keys(G.EVENTS).length} sự kiện · ${Object.keys(G.DECISIONS).length} quyết định</div>` +
    `<div class="note">Thế giới: ${st.nations} nước · ${st.provinces} tỉnh · ${st.settlements} khu dân cư (${Object.entries(st.byTier).map(([t, k]) => `${k} ${G.TIER_VI[t].toLowerCase()}`).join(', ')}) · dân ${st.pop.toLocaleString('vi')} · đô thị ${(st.urbanShare * 100).toFixed(1)}% · đất vô chủ ${(st.unclaimed * 100).toFixed(0)}% · đường: ${st.roads[2]} ô đường cái, ${st.roads[1]} ô đường mòn, ${st.roads[0]} ô lối nhỏ, ${st.bridges} ô cầu, ${st.passes} ô đèo · tầng (diện tích đất): ${st.bands.map((v, b) => `${G.BAND_VI[b].toLowerCase()} ${(v * 100).toFixed(0)}%`).join(', ')} · ${RL.dungeons.length} di tích (${RL.dungeons.map(d => esc(d.name)).join(', ')}) · ${RL.nests.length} ổ chúa</div>` +
    `<table><tr><th>Nước</th><th>Mẫu</th><th class="n">Cỡ</th><th class="n">Tỉnh</th><th class="n">Khu</th><th class="n">Dân</th><th class="n">Đô thị</th></tr>${RL.nations.map(nrow).join('')}</table>`;
}
showChecks();
$('world').onchange = showChecks;

function table(title, rows, cols, opt = {}) {
  const max = Math.max(...rows.map(r => +r[opt.barCol ?? 1] || 0), 1);
  return `<div class="panel"><h2>${title}</h2><table><tr>${cols.map((c, i) => `<th class="${i ? 'n' : ''}">${c}</th>`).join('')}${opt.bar ? '<th></th>' : ''}</tr>` +
    rows.map(r => `<tr>${r.map((v, i) => `<td class="${i ? 'n' : ''}">${esc(v)}</td>`).join('')}${opt.bar ? `<td style="width:30%"><div class="hbar" style="width:${(+r[opt.barCol ?? 1] || 0) / max * 100}%"></div></td>` : ''}</tr>`).join('') + `</table>${opt.note ? `<p class="note">${opt.note}</p>` : ''}</div>`;
}

$('run').onclick = () => {
  const N = Math.max(10, +$('n').value || 1000), base = $('seed').value || 'can-bang';
  showChecks();
  $('status').textContent = 'Đang chạy…';
  // Chạy từng đợt 25 đời rồi nhả luồng: trang không treo, hiện được tiến độ.
  setTimeout(async () => {
    const t0 = performance.now();
    // Cây sự kiện (js/tree.js, docs/12): đếm nút, nhánh, chủ đề, lần bị cổng chặn; quỹ đạo, danh phận lúc chết.
    G.TREE.stats = true; const TS = G.treeStatsReset(), TJ = { top: {}, mid: {}, midN: 0, aim: {}, soc: {}, sk: {}, skN: 0, ad: 0 };
    // Sự kiện giống loài (js/racev.js, docs/14): phần sự kiện của riêng tộc, phần đổi giọng, lựa chọn ở các quyết định của tộc.
    G.RACEV.stats = true; G.racevReset(); const RV = { k: {} };
    const RVK = ['elfAxe_warn', 'elfAxe_talk', 'elfAxe_leave', 'grudge_book', 'grudge_forgive', 'grudgeOk', 'slayer_oath', 'slayerEnd', 'dwfArt', 'dwfMad', 'price_pay', 'price_fight', 'price_refuse', 'rivalWin', 'rivalLose', 'alpha_challenge', 'alpha_back',
      'court_summer', 'court_winter', 'titheSave', 'titheLet', 'deal_memory', 'deal_gold', 'deal_free', 'cloak_stay', 'cloak_sing', 'cloak_leave', 'siren_sing', 'siren_warn', 'siren_away', 'hoard_keep', 'hoard_give', 'clan_pay', 'clan_hunt', 'clan_disown', 'core_new', 'core_slow', 'core_keep'];
    // Mạch truyện (js/story.js, docs/13): sự kiện thuộc mạch theo đời, dàn nhân vật, mạch mở / khép, chương đời.
    G.STORY.stats = true; const SZ = G.storyStatsReset(), SL = { ad: 0, adEv: 0, adLink: 0, dist: [0, 0, 0, 0, 0], noArc: 0, cast: 0, meet2: 0, ends: 0, sk: 0, skEv: 0, skLink: 0, skEnds: 0, epi: 0 };
    const storyLife = (S, sk) => { const F = S.flags, ends = (S.arcDone || []).filter(d => d.o !== 'faded' && d.o !== 'gone').length;
      if (sk) { SL.sk++; SL.skEv += F.stEv || 0; SL.skLink += F.stLink || 0; SL.skEnds += ends; return; }
      SL.cast += (S.cast || []).length; SL.meet2 += (S.cast || []).filter(p => p.n >= 2).length; SL.ends += ends;
      if (sim0.years(S) >= G.RACES[S.race].adult) { SL.ad++; SL.adEv += F.stEv || 0; SL.adLink += F.stLink || 0; if (!ends) SL.noArc++; SL.dist[Math.min(4, Math.floor((F.stLink || 0) / Math.max(1, F.stEv || 0) * 5))]++; } };
    let sim0 = null;
    const ORIGK = ['royalMain', 'royalSide', 'royalCrown', 'royalExile', 'claimWin', 'claimFail', 'nobleHeirBorn', 'nobleInherit', 'nobleRoyal', 'promo', 'duel', 'duelWin'];
    const EDUK = ['edu1', 'grad1', 'edu2', 'grad2', 'edu3', 'grad3', 'eduTop', 'eduGrant', 'eduDrop', 'eduFail2', 'eduFail3', 'mentorCraft', 'mentorMartial', 'mentorDone', 'discipleTake', 'discipleDone', 'nobleBorn', 'nobleInherit', 'nobleMerit', 'nobleBuy', 'nobleLost'];
    // Địa vị theo Tier (bước B, js/status.js): đếm đời có cờ.
    const STK = ['tested', 'gifted', 'scorn_bear', 'scorn_vow', 'scorn_leave', 'vowOk', 'vowFail', 'heirLost', 'titleDue', 'titleOk', 'titleDemote', 'regYes', 'regCert', 'regHide', 'levyGo', 'levyPay', 'levyFlee', 'levyDie',
      'bully_bear', 'bully_resist', 'bully_stop', 'bully_ignore', 'bullyWin', 'kin_stay', 'kin_elixir', 'kin_cult', 'life_push', 'life_pass', 'life_rest', 'pushOk', 'pushDie', 'retainer', 'retNo', 'dutyWin', 'dutyLoss', 'elixirY'];
    const B = { k: {}, root: {} };
    // Kinh tế bốn vòng (bước C, js/econ.js).
    const ECK = ['rework', 'patron_learn', 'patron_elixir', 'patron_gold', 'artSold', 'artMasterN', 'wrath', 'wrathFired', 'runeGear'];
    // Học viện, gia tộc, đấu giá, mỏ ma tinh (bước D, js/inst.js).
    // Kỳ ngộ, mặt trái (bước E, js/fate.js).
    const EK = ['ring_wear', 'ring_sell', 'ring_no', 'ringPast', 'ringEvil', 'ringResist', 'ringHurt', 'ringPossessed', 'ringEnlight', 'unstuck', 'grave_dig', 'grave_pray', 'ruinIn', 'ruinWin', 'ruinDie', 'ruin_book', 'ruin_pill', 'ruin_gear', 'ruin_fruit', 'ruin_gold',
      'rob_fight', 'rob_pay', 'rob_flee', 'robWin', 'robLose', 'robFled', 'robDie', 'greedN', 'greed_rob', 'greed_guard', 'greed_no', 'greedWin', 'greedLose', 'greedSeen', 'forbN', 'forb_learn', 'forb_report', 'forb_no', 'forbCaught', 'forbQuit', 'devN', 'dev_hold', 'dev_drop', 'dev_no', 'devDie', 'reawaken'];
    const DK = ['academyIn', 'academyNo', 'tourney', 'tourneyWin', 'tourneyTop', 'auction_elixir', 'auction_gear', 'auction_core', 'auction_art', 'auction_sell', 'bloodBorn', 'bloodWake', 'matchYes', 'matchNo', 'mine_dig', 'mineGood', 'mine_army'];
    const TALK = ['talAwaken', 'talBreak', 'defy_stay', 'defy_both', 'defy_leave', 'workSwitch', 'toAdv', 'aimChance', 'hermit', 'tradeWin', 'askWin'];
    const ORGK = ['advJoin', 'quests', 'advBranch', 'orgJoin', 'mercJoin', 'mercC', 'orgOfficer', 'orgLead', 'orgFound', 'headElect', 'foundVillage', 'foundTown', 'upTown', 'upCity', 'office', 'office2', 'foundNation', 'rebelOK', 'rebelFail'];
    const A = { tal: { byRoot: {}, end: {}, aim: {}, k: {}, n: {}, nTal: 0 }, dyn: { years: 0, wars: 0, flips: 0, ruins: 0, founded: 0, rebel: 0, newNat: 0, fell: 0, warDeaths: 0, soldiers: 0, soldierDeaths: 0, homeFlip: 0 }, org: { adults: 0, k: {} }, edu: { k: {}, byQ: {}, rank: {} }, orig: { k: {}, promo: {}, ev: {} }, lair: { sum: 0, yrs: 0, made: 0, npc: 0, raid: 0, prov: 0, lives: 0, tries: 0, cleared: 0, dgLives: 0, dgTries: 0, floors: 0, fights: 0, over: 0, deaths: 0 }, lives: [], causes: {}, gaps: {}, byRace: {}, byWork: {}, maxTier: {}, jobTier: {}, rose: 0, chain: 0, region: {}, zoneVisits: {}, gapByZone: {}, bornTier: {}, bornNation: {}, law: { crimes: 0, hanged: 0, served: 0, fled: 0, expelled: 0, wary: 0, fav: 0 }, trip: { lives: 0, trips: 0, roadDeaths: 0, escorts: 0 }, sea: { lives: 0, voyages: 0, fights: 0, storms: 0, wrecks: 0, pirates: 0, deaths: 0 } };
    for (let i = 0; i < N; i++) {
      if (i % 25 === 24) { $('status').textContent = `Đang chạy đời ${i + 1}/${N}…`; await new Promise(r => setTimeout(r, 0)); }
      const sim = new G.Sim({ seed: base + ':' + i, headless: true });
      sim.newLife({ noPeers: true });
      const q0 = sim.S.q;
      const y0 = sim.S.world.year, bornNat = G.nationOf(G.SET[sim.S.born.settlement]);
      sim.runToDeath();
      let S = sim.S;
      // Thế giới động trong đời này (mỗi đời một thế giới mới từ seed): đếm theo năm thế giới đã trôi (docs/03 mục 5.7).
      { const D = A.dyn, n = S.world.dyn.n; D.years += S.world.year - y0; D.wars += n.wars; D.flips += n.kept + n.rebel + n.join; D.ruins += n.ruins; D.mines = (D.mines || 0) + (n.mines || 0); D.founded += n.founded + n.revived; D.rebel += n.rebel; D.newNat += n.newNat; D.fell += n.fell;
        if (S.causeId === 'war') D.warDeaths++; if (S.flags.served) { D.soldiers++; if (S.causeId === 'war') D.soldierDeaths++; } if (S.flags.homeFlip) D.homeFlip++; }
      { const O = A.orig, F = S.flags; for (const k of ORIGK) if (F[k]) O.k[k] = (O.k[k] || 0) + 1; if (F.promoMax) O.promo[F.promoMax] = (O.promo[F.promoMax] || 0) + 1; for (const id of Object.keys(S.recent)) { const g = id.split('_')[0]; if (['tpl', 'qk', 'nt', 'rl', 'vl'].includes(g)) O.ev[g] = (O.ev[g] || 0) + 1; } }
      { const E = A.edu, F = S.flags; for (const k of EDUK) if (F[k]) E.k[k] = (E.k[k] || 0) + 1; const b = E.byQ[q0] || (E.byQ[q0] = [0, 0, 0, 0]); b[0]++; for (let l = 1; l <= (S.edu ? S.edu.lv : 0); l++) b[l]++; if (F.nobleMax) E.rank[F.nobleMax] = (E.rank[F.nobleMax] || 0) + 1; }
      { const O = A.org, F = S.flags; if (sim.years(S) >= G.RACES[S.race].adult) O.adults++; for (const k of ORGK) if (F[k]) O.k[k] = (O.k[k] || 0) + 1; }
      { const H = A.lair, n = S.world.dyn.n, F = S.flags; H.sum += n.lairSum || 0; H.yrs += n.lairYrs || 0; H.made += n.lairs || 0; H.npc += n.lairNpc || 0; H.raid += n.raidYrs || 0; H.prov += n.provYrs || 0;
        if (F.lairTries) H.lives++; H.tries += F.lairTries || 0; H.cleared += F.lairs || 0; if (F.dgTries) H.dgLives++; H.dgTries += F.dgTries || 0; H.floors += F.dgFloors || 0;
        H.fights += F.lairFights || 0; H.over += F.lairOver || 0; if (S.dead && F.inLair) H.deaths++; }
      { const T = A.tal, F = S.flags, r0 = F.root0 || '?', r1 = S.tal ? S.tal.root : '?', b = T.byRoot[r0] || (T.byRoot[r0] = [0, 0, 0, 0]);   // thiên phú, chí hướng (js/talent.js)
        b[0]++; b[1] += S.level; b[2] += sim.years(S); if (sim.ctier(S) >= 3) b[3]++; T.end[r1] = (T.end[r1] || 0) + 1;
        const ak = S.aim || 'free', a = T.aim[ak] || (T.aim[ak] = [0, 0, 0]); a[0]++; if (S.work === 'adventurer') a[1]++; a[2] += S.level;
        T.nTal += S.tal ? S.tal.list.length : 0; for (const k of TALK) if (F[k]) { T.k[k] = (T.k[k] || 0) + 1; T.n[k] = (T.n[k] || 0) + (typeof F[k] === 'number' ? F[k] : 1); } }
      const rec = { lax: S.flags.custom === 'lax', outcast: !!S.flags.outcast, race: S.race, years: sim.years(S), turns: S.age, cause: S.causeId, level: S.level, tier: sim.ctier(S), job: sim.job(S).tier, work: S.work || '—', rose: !!S.rose, hunts: S.hunts,
        adult: sim.years(S) >= G.RACES[S.race].adult, teach: G.teachOf(S, G.schoolOf(S), sim.job(S)), stuck: G.stuck(S), powIn: S.flags.powIn, powMax: S.flags.powMax, mOver: S.flags.mOver, teachAt: S.flags.teachAt, job: S.job, race: S.race,   // level, người dạy, sức theo Tier (js/cult.js, docs/08)
        st: { pct: S.pct, q: S.q, office: !!S.flags.office, office2: !!S.flags.office2, head: !!S.flags.headElect, officer: !!S.flags.orgOfficer, lead: !!(S.flags.orgLead || S.flags.advBranch || S.flags.orgFound), noble: S.flags.nobleMax || 0, ret: !!S.flags.retainer, elix: S.flags.elixirY || 0, promo: S.flags.promoMax || 0, gold: S.gold, med: G.median(G.REGION[S.loc]) } };   // địa vị (js/status.js)
      { const F = S.flags; for (const k of [...STK, ...ECK, ...DK, ...EK]) if (F[k]) B.k[k] = (B.k[k] || 0) + 1;
        const o = F.royal ? 'Hoàng tộc' : F.house || F.houseLeft ? 'Nhà quý tộc' : 'Thường dân', b = B.root[o] || (B.root[o] = [0, 0, 0, 0]); b[0]++; b[1] += G.RARITY[G.RANK[F.root0] || 0].rate; if (F.rootBlood) { b[2]++; b[3] += F.rootBlood; } }
      { const top = (G.trajTop(S)[0] || { a: '—' }).a, ak = S.aim || 'free';   // quỹ đạo, danh phận lúc chết (đời đầu)

        ['Quyết định thuộc mạch', pct(SZ.dlink, SZ.dec)], ['Người trong dàn lúc chết (TB, đời đầu)', (SL.cast / N).toFixed(1)], ['… trong đó gặp từ 2 lần', (SL.meet2 / N).toFixed(1)],
        ['Mạch khép mỗi đời (TB, đời đầu)', (SL.ends / N).toFixed(1)], ['Mạch khép mỗi kiếp Bộ Xương', (SL.skEnds / Math.max(1, SL.sk)).toFixed(1)], ['Đời trưởng thành không khép mạch nào', pct(SL.noArc, Math.max(1, SL.ad))],
        ['Đời trưởng thành theo phần thuộc mạch: <20 / 20–40 / 40–60 / 60–80 / ≥80%', SL.dist.map(n => pct(n, Math.max(1, SL.ad))).join(' / ')]], ['', ''],
        { note: 'Mục tiêu người dùng chốt 16/10/2026: khoảng một nửa sự kiện thuộc mạch (nút của mạch, sự kiện mở mạch, người quen xuất hiện, nhánh của cây sự kiện), nửa còn lại ngẫu nhiên.' }));
      const AK = Object.keys(G.ARCS), endsOf = k => Object.entries(SZ.end).filter(([e]) => e.split(':')[0] === k), sumN = L => L.reduce((a, x) => a + x[1], 0);
      out.push(table('Mạch truyện: mở, khép', AK.map(k => { const E = endsOf(k), fd = Object.entries(SZ.fade).filter(([e]) => e.split(':')[0] === k);
        return [G.ARCS[k].nameVi, SZ.open[k] || 0, per(SZ.open[k] || 0), sumN(E), E.sort((a, b) => b[1] - a[1]).map(([e, n]) => `${e.split(':')[1]} ${n}`).join(', '), SZ.gone[k] || 0, fd.map(([e, n]) => `${e.split(':')[1]} ${n}`).join(', ') || '0']; }).filter(r => r[1]),
        ['Mạch', 'Mở', '/ 1000 đời', 'Khép', 'Kết', 'Người chết trước', 'Phai (bước)'], { note: 'Mở: mạch được gieo (đủ chỗ: tối đa 3 mạch cùng lúc, trừ lời bà đồng). Còn lại = mạch đang dở khi nhân vật chết.' }));
      const CI = {}; for (const [e, n] of Object.entries(SZ.chap)) { const [id, r] = e.split(':'); (CI[id] = CI[id] || [0, 0])[r === 'ok' ? 0 : 1] += n; }
      out.push(table('Chương đời', Object.entries(CI).sort((a, b) => (b[1][0] + b[1][1]) - (a[1][0] + a[1][1])).map(([id, [ok, no]]) => { const C = G.CHAPTERS.find(c => c.id === id);
        return [id === 'arc' ? 'Câu hỏi của mạch chính' : id === 'tier' ? 'Bước lên Tier kế tiếp' : C ? C.q() : id, ok + no, pct(ok, ok + no)]; }), ['Câu hỏi', 'Chương', 'Làm được'], { bar: true, note: 'Mỗi quãng đời (thiếu thời, lập thân, trung niên, xế chiều; Bộ Xương: thức giấc, giữa hai cõi, lửa hồn lụi dần) một câu hỏi. Chương đang mở lúc chết tính là chưa làm được.' })); }
    // Sự kiện giống loài (js/racev.js, docs/14).
    { const R = G.RACEV, rows = Object.keys(R.n).sort((a, b) => R.n[b] - R.n[a]).map(r => { const ids = (G.RACE_EV[r] || []).filter(id => R.byId[id]).sort((a, b) => R.byId[b] - R.byId[a]);
        return [J.races[r].nameVi, (A.byRace[r] || []).length, R.n[r], pct(R.own[r] || 0, R.n[r]), pct(R.voice[r] || 0, R.n[r]), ids.slice(0, 4).map(id => `${id} ${R.byId[id]}`).join(', ')]; });
      out.push(table('Sự kiện giống loài', rows, ['Giống loài', 'Đời', 'Sự kiện', 'Của riêng tộc', 'Đổi giọng', 'Hay gặp nhất'], { note: 'Đời đầu, người sống. "Của riêng tộc": nút của js/racev.js và tn_rite, con_oil, con_dream; "Đổi giọng": sự kiện chung kể bằng giọng của tộc (lễ hội, được mùa, tuổi già…). Mẫu số gồm cả sự kiện của mạch truyện, người quen.' }));
      const rk = k => [k, RV.k[k] || 0, pct(RV.k[k] || 0, N)];
      out.push(table('Sự kiện giống loài: lựa chọn', RVK.map(rk).filter(r => r[1]), ['Cờ', 'Đời', '% mọi đời'], { note: 'Tiền tố: elfAxe tiều phu (Tiên Tộc), grudge Sổ Thù, slayer Kẻ Diệt, dwfArt/dwfMad cơn nhập thần (Người Lùn), price giá máu, rival kẻ thù cũ (Orc), alpha con đầu đàn (Người Thú), court/tithe/deal đình và giao kèo (Yêu Tinh), cloak/siren (Hải Tộc), hoard/clan (Long Nhân), core thay lõi (Cơ Nhân).' })); }
    out.push(table('Nơi sinh: quốc gia', Object.entries(A.bornNation).sort((a, b) => b[1] - a[1]).map(([k, n]) => [k, n, pct(n, N)]), ['Nước', 'Đời', '%'], { bar: true }));
    $('out').innerHTML = out.join('');
    $('status').textContent = `${N} đời + ${A.chain} kiếp Bộ Xương trong ${ms} ms.`;
  }, 30);
};
// Thế giới động không có đời người (js/dynamic.js G.runWorld): mỗi thế giới chạy số năm đã chọn, đo số nước còn sống, tỉnh đổi chủ,
// khu sụp / lập (docs/03 mục 10). Chạy từng thế giới rồi nhả luồng.
$('runHistory').onclick = () => {
  const NW = Math.max(5, Math.min(200, +$('nw').value || 50)), years = Math.max(50, +$('ny').value || 300), base = $('world').value || 'can-bang';
  G.useWorld(base);
  setTimeout(async () => {
    const t0 = performance.now(), rs = [];
    for (let w = 0; w < NW; w++) {
      $('status').textContent = `Đang chạy thế giới động ${w + 1}/${NW}…`; await new Promise(r => setTimeout(r, 0));
      const W = G.runWorld(base + ':h' + w, years), n = W.dyn.n;
      rs.push({ alive: W.dyn.nat.filter(x => x.alive).length, lairs: (n.lairSum || 0) / Math.max(1, n.lairYrs || 0), lv3: W.dyn.lairs.filter(l => l.empty == null && l.lv === 3).length, lairMade: n.lairs || 0, lairNpc: n.lairNpc || 0, lairBack: n.lairBack || 0, lairRuin: n.lairRuin || 0, raid: (n.raidYrs || 0) / Math.max(1, n.provYrs || 0), flips: n.kept + n.rebel + n.join, ruins: n.ruins, founded: n.founded + n.revived, wars: n.wars, rebel: n.rebel, newNat: n.newNat, fell: n.fell, annex: n.annex, moved: n.moved, kings: n.kings, roads: n.roads, mines: n.mines || 0 });
    }
    const ms = Math.round(performance.now() - t0), med = k => { const a = rs.map(r => r[k]).sort((x, y) => x - y); return a[a.length >> 1]; }, per = k => (rs.reduce((a, r) => a + r[k], 0) / NW / years * 100).toFixed(2);
    const pct = (a, b) => (a / b * 100).toFixed(1) + '%';
    const nAlive = {}; for (const r of rs) nAlive[r.alive] = (nAlive[r.alive] || 0) + 1;
    const out = [];
    out.push(table(`${NW} thế giới × ${years} năm`, [['Nước còn sống: trung vị', med('alive'), ''], ['Nước còn sống: ít nhất / nhiều nhất', Math.min(...rs.map(r => r.alive)) + ' / ' + Math.max(...rs.map(r => r.alive)), ''],
      ['Tỉnh đổi chủ', med('flips'), per('flips')], ['Chiến tranh', med('wars'), per('wars')], ['Nổi loạn thành công', med('rebel'), per('rebel')], ['Nước mới lập', med('newNat'), per('newNat')], ['Nước diệt vong', med('fell'), per('fell')],
      ['Tỉnh vô chủ sáp nhập', med('annex'), per('annex')], ['Khu dân cư sụp', med('ruins'), per('ruins')], ['Khu dân cư lập mới, dựng lại', med('founded'), per('founded')], ['Dời đô', med('moved'), per('moved')], ['Vua băng hà', med('kings'), per('kings')], ['Đoạn đường xuống cấp', med('roads'), per('roads')], ['Mỏ ma tinh mới lộ', med('mines'), per('mines')], ['Hang ổ đang có (trung bình theo năm)', (rs.reduce((a, r) => a + r.lairs, 0) / NW).toFixed(1), ''], ['Sào huyệt lúc kết thúc', med('lv3'), ''], ['Hang mới mọc', med('lairMade'), per('lairMade')], ['Hang trống bị quái chiếm lại', med('lairBack'), per('lairBack')], ['Hang NPC dọn', med('lairNpc'), per('lairNpc')], ['Phế tích thành hang', med('lairRuin'), per('lairRuin')], ['Năm-tỉnh có thú triều', pct(rs.reduce((a, r) => a + r.raid, 0), NW), ''], ['ms / thế giới', Math.round(ms / NW), '']],
      ['', 'Trung vị / thế giới', '/ 100 năm (trung bình)'], { note: 'Mục tiêu docs/03 mục 10: nước còn sống sau 300 năm trung vị 5–7, không thế giới nào dưới 3; tỉnh đổi chủ 3–8 / 100 năm; khu sụp / lập 1–3 / 100 năm. Hệ số ở G.DYN (js/dynamic.js).' }));
    out.push(table('Số nước còn sống', Object.entries(nAlive).map(([k, v]) => [k + ' nước', v, pct(v, NW)]), ['', 'Thế giới', '%'], { bar: true }));
    $('out').innerHTML = out.join('');
    $('status').textContent = `${NW} thế giới × ${years} năm trong ${ms} ms.`;
  }, 30);
};
// Tạo nhiều thế giới (chỉ dựng, chưa sống) để xem phân bố mẫu quốc gia, số nước, khu dân cư, tỉ lệ đô thị (docs/04 mục 6, docs/05 mục 12).
$('runWorlds').onclick = () => {
  const NW = Math.max(5, +$('nw').value || 100), base = $('world').value || 'can-bang';
  $('status').textContent = `Đang tạo ${NW} thế giới…`;
  // Chạy từng đợt 5 thế giới rồi nhả luồng, để trang không treo và hiện được tiến độ.
  setTimeout(async () => {
    const t0 = performance.now(), tpl = Object.fromEntries(G.NATION_TEMPLATES.map(t => [t.id, 0])), nN = {}, races = {};
    let errs = 0, warns = 0, sets = 0, urb = 0, unc = 0, prov = 0;
    for (let w = 0; w < NW; w++) {
      if (w % 5 === 4) { $('status').textContent = `Đang tạo thế giới ${w + 1}/${NW}…`; await new Promise(r => setTimeout(r, 0)); }
      const RL = G.buildRealm(G.map, base + ':w' + w);
      for (const n of RL.nations) { tpl[n.template]++; races[n.race] = (races[n.race] || 0) + 1; }
      nN[RL.nations.length] = (nN[RL.nations.length] || 0) + 1;
      errs += RL.check.errors.length; warns += RL.check.warnings.length;
      sets += RL.stats.settlements; urb += RL.stats.urbanShare; unc += RL.stats.unclaimed; prov += RL.stats.provinces;
    }
    const ms = Math.round(performance.now() - t0), pct = (a, b) => (a / b * 100).toFixed(1) + '%';
    const out = [];
    out.push(table(`${NW} thế giới`, [['Lỗi', errs], ['Cảnh báo', warns], ['Khu dân cư / thế giới', (sets / NW).toFixed(1)], ['Tỉnh / thế giới', (prov / NW).toFixed(1)], ['Tỉ lệ đô thị', pct(urb, NW)], ['Đất vô chủ', pct(unc, NW)], ['ms / thế giới', Math.round(ms / NW)]], ['', '']));
    out.push(table('Số nước', Object.entries(nN).map(([k, v]) => [k + ' nước', v, pct(v, NW)]), ['', 'Thế giới', '%'], { bar: true }));
    out.push(table('Chủng tộc làm chủ', Object.entries(races).sort((a, b) => b[1] - a[1]).map(([r, v]) => [J.races[r].nameVi, v, pct(v, NW)]), ['Chủng tộc', 'Nước', '% thế giới'], { bar: true }));
    const never = Object.entries(tpl).filter(([, v]) => !v).map(([k]) => k);
    out.push(table('Mẫu quốc gia', Object.entries(tpl).sort((a, b) => b[1] - a[1]).map(([id, v]) => [id + ' ' + G.NATION_TEMPLATES.find(t => t.id === id).label, v, pct(v, NW)]), ['Mẫu', 'Lần', '% thế giới'],
      { bar: true, note: never.length ? `Chưa bao giờ ra: ${never.join(', ')}` : 'Mẫu nào cũng ra ít nhất một lần.' }));
    $('out').innerHTML = out.join('');
    $('status').textContent = `${NW} thế giới trong ${ms} ms.`;
    G.useWorld($('world').value || 'can-bang');
  }, 30);
};
if (!/noauto/.test(location.search)) $('run').click();   // ?noauto: chỉ nạp, không tự chạy (thử từng phần trong console)
</script>
